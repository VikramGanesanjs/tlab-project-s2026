# Merge this file with DINOv3's ssl_default_config.yaml through train.py.
MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda

train:
  dataset_path: ADNI:root=/common/ganesanv/tlab/data/ADNI
  output_dir: /common/ganesanv/tlab/runs/continued_pretraining/adni
  batch_size_per_gpu: 64
  num_workers: 8
  cache_dataset: false
  # ``fold`` is zero-based; the next fold is test and the remainder is train.
  n_folds: 5
  fold: 0
  data_seed: 0
  train_ratio: 1.0

optim:
  warmup_iterations: 800
  lr: 0.001
checkpointing:
  period: 500  # Save a checkpoint every N training iterations.
  loss_window_iterations: 100  # Only save when this window's mean loss improves.
  max_to_keep: 20

student:
  arch: vit_base
  patch_size: 16
  drop_path_rate: 0.1
  freeze_last_layer_epochs: 0
  resume_from_teacher_chkpt: /common/ganesanv/tlab/opt/dinov3-weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth

lora_r: 16
unfreeze_last_layers: 0
unfreeze_patch_embeddings: false
freeze_iterations: 1600  # LoRA remains frozen for the first N training iterations.
